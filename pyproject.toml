[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "marsdash"
version = "1.0.0"
description = "Mars news and weather dashboard fed by a scheduled scraper: tested parsers, a committed JSON snapshot as fallback, Curiosity REMS weather statistics, and a static report published to Pages."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Freddrick Logan" }]
dependencies = ["requests>=2.32", "beautifulsoup4>=4.12", "numpy>=2.0", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-requests>=2.32", "types-beautifulsoup4>=4.12", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
marsdash = "marsdash.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/marsdash"]

[tool.hatch.build]
include = ["src/marsdash/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "DTZ", "S", "SIM", "RUF", "T20", "PTH", "RET", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]
"src/marsdash/cli.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["bs4", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["marsdash"]
omit = ["src/marsdash/cli.py"]

[tool.coverage.report]
show_missing = true
